# Home Guardian — nginx 패치 (참고용 보관본, 실제 도메인은 운영자 .env.local 에서 주입)
#
# 기존 /etc/nginx/sites-available/personal-website 파일의 server block 두 개
# (80, 443) 안에 아래 location 블록 두 개를 추가한다. 루트(/)는 기존 Next.js
# (127.0.0.1:3200) 프록시를 그대로 둔다.
#
# - /health : 로드밸런서/모니터 헬스체크
# - /api/v1/internal/identity-enrichment/ : 공개 프록시에서 항상 차단
# - /api/v1/ : FastAPI 백엔드 (127.0.0.1:8010)

location = /health {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8010/health;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

# 제품 식별 검토 API는 Raspberry Pi의 localhost에서만 사용한다. FastAPI의
# loopback 검증에 더해 공개 reverse proxy에서도 이 경로를 열지 않는다.
location ^~ /api/v1/internal/identity-enrichment/ {
    return 404;
}

location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8010;
    # A real Android scan may finish the native sweep first and then wait for
    # Raspberry Pi protocol enrichment/catalog matching. Keep this longer than
    # the mobile scan request ceiling so nginx does not turn a completed scan
    # into a false network error.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 2m;
}
