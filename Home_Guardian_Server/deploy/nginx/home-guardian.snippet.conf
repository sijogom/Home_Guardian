# Home Guardian — FastAPI 백엔드 reverse proxy snippet
# 설치 위치: /etc/nginx/snippets/home-guardian.conf
# 사용 위치: /etc/nginx/sites-available/personal-website 의 HTTPS server block 안에
#   include /etc/nginx/snippets/home-guardian.conf;

location = /health {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8010/health;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
}

# 제품 식별 검토 API는 Raspberry Pi localhost 전용이다.
location ^~ /api/v1/internal/identity-enrichment/ {
    return 404;
}

location /api/v1/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8010;
    # A real Android scan may finish the native sweep first and then wait for
    # Raspberry Pi protocol enrichment/catalog matching. Keep this longer than
    # the mobile scan request ceiling so nginx does not turn a completed scan
    # into a false network error.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    client_max_body_size 2m;
}
